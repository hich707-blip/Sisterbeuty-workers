<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worker Portal</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff8fb;color:#171216}header{background:#171216;color:white;padding:25px 6%;display:flex;justify-content:space-between}.tabs{padding:18px 6%;background:white;display:flex;gap:8px;flex-wrap:wrap}.tab,button{padding:12px 17px;border-radius:999px;border:1px solid #e5d5dc;background:white;cursor:pointer;font-weight:700}.active,.save{background:#e66b9b;color:white;border-color:#e66b9b}main{max-width:1000px;margin:auto;padding:30px 6%}.panel{background:white;border:1px solid #eadce2;border-radius:24px;padding:24px;margin-bottom:20px}.workers{display:grid;grid-template-columns:1fr 1fr;gap:15px}.worker{border:1px solid #eadce2;border-radius:20px;padding:20px}input,select{width:100%;padding:13px;border:1px solid #d9cbd1;border-radius:12px;margin:6px 0 16px}.clock{background:#27865d;color:white;border:0}.out{background:#9c3152;color:white;border:0}@media(max-width:650px){.workers{grid-template-columns:1fr}}</style></head><body><header><b>Sisters Beauty Salon and Barbershop</b><span>Worker Portal</span></header><div class="tabs"><button class="tab active" onclick="tab('workers',this)">Workers</button><button class="tab" onclick="tab('add',this)">+ Add New Worker</button><button class="tab" onclick="tab('hours',this)">Hours</button></div><main><div id="workers" class="panel"><h1>Worker Portal</h1><div id="list" class="workers"></div></div><div id="add" class="panel" style="display:none"><h2>Add New Worker</h2><label>Name</label><input id="name" placeholder="Worker name"><label>Job</label><select id="job"><option>Nail Tech</option><option>Barber</option><option>Hair Stylist</option><option>Other</option></select><button class="save" onclick="add()">Save Worker</button><p id="msg"></p></div><div id="hours" class="panel" style="display:none"><h2>Saved Hours</h2><div id="records"></div></div></main><script>let ws=JSON.parse(localStorage.ws||'null')||[{id:1,name:'Worker 1',job:'Nail Tech'},{id:2,name:'Worker 2',job:'Barber'}];let rs=JSON.parse(localStorage.rs||'[]');function save(){localStorage.ws=JSON.stringify(ws);localStorage.rs=JSON.stringify(rs)}function render(){list.innerHTML=ws.map(w=>{let o=rs.find(r=>r.id==w.id&&!r.out);return '<div class="worker"><h3>'+esc(w.name)+'</h3><p>'+esc(w.job)+'</p><button class="'+(o?'out':'clock')+'" onclick="clock('+w.id+')">'+(o?'CLOCK OUT':'CLOCK IN')+'</button>'+(o?'<p>In: '+new Date(o.in).toLocaleString()+'</p>':'')+'</div>'}).join('');records.innerHTML=rs.slice().reverse().map(r=>'<div class="panel"><b>'+esc(r.name)+'</b> — '+esc(r.job)+'<br>In: '+new Date(r.in).toLocaleString()+'<br>Out: '+(r.out?new Date(r.out).toLocaleString():'Still clocked in')+'</div>').join('')||'<p>No records yet.</p>'}function clock(id){let o=rs.find(r=>r.id==id&&!r.out);if(o)o.out=new Date().toISOString();else{let w=ws.find(w=>w.id==id);rs.push({id:w.id,name:w.name,job:w.job,in:new Date().toISOString(),out:null})}save();render()}function add(){let n=name.value.trim();if(!n)return msg.textContent='Enter a name.';ws.push({id:Date.now(),name:n,job:job.value});save();name.value='';msg.textContent='Worker saved!';render()}function tab(id,b){document.querySelectorAll('main>div').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}render()</script></body></html>
